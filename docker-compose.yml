services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgf_app_1
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SGF
      APP_ENV: local
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sgf
      DB_USERNAME: sgf
      DB_PASSWORD: sgf
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      VITE_APP_NAME: SGF
    volumes:
      - .:/var/www/html
      - sgf_vendor:/var/www/html/vendor
      - sgf_node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgf_app_2
    ports:
      - "8001:8000"
    environment:
      APP_NAME: SGF
      APP_ENV: local
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sgf
      DB_USERNAME: sgf
      DB_PASSWORD: sgf
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      VITE_APP_NAME: SGF
    volumes:
      - .:/var/www/html
      - sgf_vendor:/var/www/html/vendor
      - sgf_node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: sgf_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sgf
      MYSQL_USER: sgf
      MYSQL_PASSWORD: sgf
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - sgf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usgf", "-psgf"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sgf_mysql_data:
  sgf_vendor:
  sgf_node_modules:
